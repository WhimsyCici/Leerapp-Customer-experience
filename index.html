<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mijn Leerapp — Tentamenvoorbereiding</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap');

:root{
  --cream:#FBF3EF;
  --card:#FFFCFA;
  --rose:#E8AEB7;
  --rose-deep:#C97B8B;
  --rose-dark:#A85D6E;
  --lilac:#DCD2ED;
  --lilac-deep:#B9A6D9;
  --ink:#4A3B3F;
  --ink-soft:#7A6468;
  --gold:#D8B98A;
  --green-ok:#8FAE8B;
  --red-no:#C97B7B;
  --shadow: 0 6px 20px rgba(169,110,120,0.12);
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:
    radial-gradient(circle at 8% 10%, rgba(232,174,183,0.15), transparent 40%),
    radial-gradient(circle at 95% 85%, rgba(220,210,237,0.25), transparent 45%),
    var(--cream);
  color:var(--ink);
  font-family:'Lora', serif;
  line-height:1.6;
  min-height:100vh;
}
h1,h2,h3,h4{font-family:'Playfair Display', serif; margin:0 0 0.5em 0; color:var(--rose-dark); font-weight:600;}
.app{display:flex; min-height:100vh;}

/* Sidebar */
.sidebar{
  width:230px; flex-shrink:0;
  background:linear-gradient(180deg, #F6E2E6, #EFDCE9);
  padding:28px 16px;
  border-right:1px solid rgba(169,110,120,0.15);
}
.brand{font-family:'Playfair Display', serif; font-size:1.3em; color:var(--rose-dark); margin-bottom:6px; display:flex; align-items:center; gap:8px;}
.brand-sub{font-size:0.78em; color:var(--ink-soft); margin-bottom:28px;}
.nav-group{margin-bottom:6px;}
.nav-item{
  display:flex; align-items:center; gap:8px;
  padding:10px 12px; border-radius:12px; cursor:pointer;
  font-size:0.95em; color:var(--ink); margin-bottom:4px;
  transition:background 0.15s;
}
.nav-item:hover{background:rgba(255,255,255,0.5);}
.nav-item.active{background:var(--card); box-shadow:var(--shadow); color:var(--rose-dark); font-weight:600;}
.nav-sub{margin-left:14px; border-left:2px solid rgba(169,110,120,0.2); padding-left:10px;}
.nav-sub .nav-item{font-size:0.87em; padding:7px 10px;}

/* Main */
.main{flex:1; padding:36px 44px; max-width:920px;}
.card{
  background:var(--card); border-radius:20px; padding:26px 30px;
  box-shadow:var(--shadow); margin-bottom:22px;
}
.deco{font-size:0.95em; opacity:0.6;}
.pill{
  display:inline-block; padding:3px 12px; border-radius:999px;
  background:var(--lilac); color:var(--rose-dark); font-size:0.78em; font-weight:600;
  margin-right:6px;
}
.pill.gold{background:#F1E3C8; color:#8A6A2E;}
.pill.rose{background:var(--rose); color:#fff;}
button{
  font-family:'Lora', serif; cursor:pointer; border:none; border-radius:12px;
  padding:10px 20px; font-size:0.95em; background:var(--rose); color:#fff; font-weight:600;
  box-shadow: 0 3px 10px rgba(201,123,139,0.35);
  transition:transform 0.1s, background 0.15s;
}
button:hover{background:var(--rose-deep);}
button:active{transform:scale(0.98);}
button.secondary{background:transparent; color:var(--rose-dark); border:1.5px solid var(--rose); box-shadow:none;}
button.secondary:hover{background:rgba(232,174,183,0.15);}
button:disabled{opacity:0.4; cursor:not-allowed;}

/* Dashboard */
.grid{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.stat{text-align:center; padding:18px;}
.stat .num{font-family:'Playfair Display'; font-size:2em; color:var(--rose-dark);}
.stat .label{font-size:0.85em; color:var(--ink-soft);}
.chapter-tile{
  display:flex; justify-content:space-between; align-items:center;
  padding:16px 20px; border-radius:16px; background:linear-gradient(120deg,#FCEEF1,#F6ECF7);
  margin-bottom:12px; cursor:pointer; border:1px solid rgba(232,174,183,0.3);
}
.chapter-tile:hover{box-shadow:var(--shadow);}

/* Summary content */
.summary h4{color:var(--rose-deep); border-bottom:1.5px dashed var(--lilac-deep); padding-bottom:4px; margin-top:26px;}
.summary p{margin:8px 0;}
.term{color:var(--rose-dark); font-weight:600;}
blockquote{
  font-style:italic; border-left:3px solid var(--rose); margin:16px 0; padding:8px 18px;
  background:rgba(232,174,183,0.08); border-radius:0 12px 12px 0; color:var(--ink-soft);
}

/* Infographic */
.info-block{margin-bottom:34px;}
.pyramid{display:flex; flex-direction:column; align-items:center; gap:6px; margin:20px 0;}
.pyr-level{
  border-radius:14px; padding:14px 20px; text-align:center; color:#fff; font-weight:600;
  box-shadow:var(--shadow);
}
.pyr-level small{display:block; font-weight:400; font-size:0.8em; opacity:0.95; margin-top:2px;}
.pyr-1{width:60%; background:linear-gradient(120deg,#C97B8B,#A85D6E);}
.pyr-2{width:78%; background:linear-gradient(120deg,#D69AA6,#C97B8B);}
.pyr-3{width:96%; background:linear-gradient(120deg,#E8AEB7,#D69AA6);}
.pyr-split{display:flex; gap:6px; width:100%;}
.pyr-split div{flex:1; border-radius:10px; padding:8px; font-size:0.82em; background:rgba(255,255,255,0.18);}

.cycle{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:18px 0;}
.cycle-step{
  background:var(--card); border:2px solid var(--lilac); border-radius:16px;
  padding:12px 16px; width:150px; text-align:center; font-size:0.85em; position:relative;
}
.cycle-step .n{
  display:inline-flex; align-items:center; justify-content:center;
  width:24px; height:24px; border-radius:50%; background:var(--lilac-deep); color:#fff;
  font-size:0.8em; margin-bottom:6px;
}
.arrow{align-self:center; color:var(--lilac-deep); font-size:1.3em;}

.card-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:12px; margin:16px 0;}
.def-card{background:linear-gradient(150deg,#FDF6F4,#F5EEF8); border-radius:16px; padding:14px 16px; font-size:0.87em; border:1px solid rgba(185,166,217,0.3);}
.def-card .t{font-weight:700; color:var(--rose-dark); margin-bottom:4px; font-family:'Playfair Display';}

.nps-scale{display:flex; border-radius:12px; overflow:hidden; margin:14px 0; font-size:0.82em; text-align:center; color:#fff; font-weight:600;}
.nps-scale div{padding:10px 4px;}
.nps-det{flex:7; background:#C97B7B;}
.nps-pas{flex:2; background:#E0C070;}
.nps-pro{flex:2; background:#8FAE8B;}

.roadmap-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin:14px 0;}
.rm-cell{background:var(--card); border:1px solid var(--lilac); border-radius:12px; padding:8px 10px; font-size:0.8em;}
.rm-row-label{font-weight:700; color:var(--rose-dark); font-size:0.82em; margin-top:10px;}

/* Quiz */
.progressbar{height:8px; background:#F1E4E8; border-radius:6px; overflow:hidden; margin-bottom:18px;}
.progressbar > div{height:100%; background:linear-gradient(90deg,var(--rose),var(--lilac-deep)); border-radius:6px; transition:width 0.2s;}
.qcounter{font-size:0.85em; color:var(--ink-soft); margin-bottom:14px;}
.option{
  display:block; width:100%; text-align:left; background:var(--card); border:1.5px solid var(--lilac);
  border-radius:14px; padding:13px 16px; margin-bottom:10px; font-size:0.95em; color:var(--ink);
  cursor:pointer; transition:border-color 0.15s, background 0.15s;
}
.option:hover{border-color:var(--rose);}
.option.selected{border-color:var(--rose-deep); background:rgba(232,174,183,0.18); font-weight:600;}
.option.correct{border-color:var(--green-ok); background:rgba(143,174,139,0.18);}
.option.incorrect{border-color:var(--red-no); background:rgba(201,123,123,0.18);}
.qnav{display:flex; justify-content:space-between; margin-top:20px; flex-wrap:wrap; gap:8px;}
.qmap{display:flex; flex-wrap:wrap; gap:6px; margin:16px 0;}
.qmap span{
  width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  font-size:0.75em; background:#F1E4E8; color:var(--ink-soft); cursor:pointer;
}
.qmap span.answered{background:var(--lilac-deep); color:#fff;}
.qmap span.current{outline:2px solid var(--rose-deep); outline-offset:1px;}

/* Results */
.result-score{text-align:center; padding:20px;}
.result-score .big{font-family:'Playfair Display'; font-size:3em; color:var(--rose-dark);}
.review-item{border-left:4px solid var(--lilac-deep); padding:10px 16px; margin-bottom:12px; background:rgba(255,255,255,0.5); border-radius:0 12px 12px 0;}
.review-item.wrong{border-left-color:var(--red-no);}
.review-item.skipped{border-left-color:var(--gold);}
.topic-bar-row{display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:0.85em;}
.topic-bar-row .name{width:220px; flex-shrink:0;}
.topic-bar-track{flex:1; height:10px; background:#F1E4E8; border-radius:6px; overflow:hidden;}
.topic-bar-fill{height:100%; border-radius:6px;}

.sparkle{position:absolute; opacity:0.5; pointer-events:none;}
.empty-note{color:var(--ink-soft); font-style:italic; font-size:0.9em;}
@media (max-width:760px){
  .app{flex-direction:column;}
  .sidebar{width:100%;}
  .main{padding:20px;}
}
</style>
</head>

    title: "Aanpak voor klantgerichtheid en customer experience",
    summary: `
      <blockquote>"Stop trying to delight your customers, just solve their problems." — Dixon e.a., Harvard Business Review</blockquote>
      <p>Veel organisaties promoten actief dat ze 'de klant centraal' stellen of 'klantgericht' werken. De vraag is of dit effectief wordt aangepakt, of dat het vooral het inspelen op een trend is. Als alleen de manier verandert waarop medewerkers klanten te woord staan, terwijl klantprocessen hetzelfde blijven, voelt het voor klanten alsof alleen de buitenkant van het bedrijf is verbeterd.</p>
      <p>Het advies uit het aangehaalde HBR-artikel: verwen klanten niet steeds met nieuwe 'spiegeltjes en kraaltjes', maar bied structurele oplossingen voor de vragen waar ze écht mee zitten. Bijvoorbeeld: een eerlijke rente in plaats van cadeautjes, flexibele onderhoudsbeurten in plaats van een bloemetje, of schade ook in twijfelgevallen oplossen in plaats van concertkaartjes geven.</p>

      <h4>Mythe: we moeten klanten tevreden houden met extra's</h4>
      <p>Bedrijven verwarren <span class="term">klantgerichtheid</span> vaak met <span class="term">klantvriendelijkheid</span> en denken dat cadeautjes en extra's hen klantgericht maken. Maar een bedrijf dat structurele problemen oplost, is pas écht vriendelijk voor zijn klanten. Dat vraagt vaak om structurele aanpassingen, zeker binnen grote organisaties.</p>

      <h4>Drie stadia van klantgerichtheid (piramide)</h4>
      <p>Klantgerichtheid is geen kwaliteit die een organisatie wel of niet heeft, maar een kwaliteit waarin een organisatie zich kan ontwikkelen en doorgroeien. Er zijn drie stadia (aangepast van Balachandran, 2007). Het heeft pas zin om een trede hoger te gaan als aan de laag eronder is voldaan.</p>
      <p><span class="term">1. Productgericht en transactiegericht ('fix the basics' / klanttevredenheid):</span> de basis — kan het product worden gevonden en gekocht, werkt het naar behoren, kan een klant na aankoop nog contact leggen bij vragen, klachten of reparaties? Klachten gaan vaak over dit niveau. Klanten willen geen langdurige relatie aangaan als hier nog problemen zijn. Klanttevredenheid wordt hier gemeten, na aankoop van een product of dienst.</p>
      <p><span class="term">2. Langdurige klantrelatie (klanten leren kennen / loyaliteit):</span> pas als klanttevredenheid goed is, kan gewerkt worden aan een langdurigere, loyale klantrelatie. Het bedrijf stuurt bewust op het leren kennen van klanten en hun behoeften. Loyaliteit is hier een beter meetinstrument dan klanttevredenheid alleen; klanttevredenheid én NPS zijn bruikbaar, en de ontwikkeling ervan in de tijd is belangrijker dan een losse meting.</p>
      <p><span class="term">3. Betrokkenheid klant (co-creatie / samen met klant):</span> bij co-creatie zijn klanten écht betrokken bij innovatie en productontwikkeling — verder dan een klantenpanel waarin ze hun mening kwijt kunnen. Klanten hebben dan echt invloed op de bedrijfsvoering en denken actief mee over processen en productontwerp. Voorbeeld: bij Ziggo's CI+ hielpen de eerste gebruikers elkaar op het forum en werkten Ziggo-experts actief mee.</p>
      <p>Nieuwe ideeën passen soms niet bij het stadium waarin een bedrijf zich bevindt (bijvoorbeeld een accountmanager die klanten uitnodigt voor een samenwerkingsvoorstel, terwijl de maandelijkse facturen nog niet foutloos binnenkomen). Zoals Dixon (2010) het formuleert: 'Loyalty has a lot more to do with how well companies deliver on their basic, even plain-vanilla promises than on how dazzling the service experience might be.'</p>

      <h4>Twee strategische vraagstukken als basis</h4>
      <p>Voordat de stappen van de customer experience-aanpak worden toegelicht, gaat het eerst om twee vraagstukken die voor elke organisatie de basis vormen:</p>
      <p><span class="term">1. Positionering / klantstrategie:</span> welke unieke positie kiest u voor uw klanten? Wie zijn uw belangrijkste klanten, wat vinden ze van wezenlijk belang, en waarmee onderscheidt u zich? Veel organisaties willen alles aan iedereen bieden en maken geen expliciete keuzes.</p>
      <p><span class="term">2. Klantbediening:</span> hoe geeft u invulling aan de strategische keuzes — hoe gaat u waarmaken wat u belooft, op alle touchpoints en in alle kanalen?</p>

      <h4>De customer experience-aanpak: vijf stappen</h4>
      <p>Een klantstrategie is altijd gebaseerd op een bestaande bedrijfsstrategie. Met het strategiemodel van <span class="term">Treacy en Wiersema</span> kan gekozen worden voor <span class="term">customer intimacy</span> (bekendstaan om goede service), <span class="term">product leadership</span> (de beste producten) of <span class="term">operational excellence</span> (de laagste kosten). Bij customer intimacy hoort een actievere houding naar klanten, met meer service, dan bij operational excellence.</p>
      <p><span class="term">1. Klantinzicht</span> — wat vinden uw klanten belangrijk? Dit is de basis voor alle keuzes over klanten: welke klantgroepen zijn belangrijk, en wat vinden zij belangrijk? Bronnen: klant- en marktonderzoek, interviews, database-analyse. Maak klantgroepen expliciet met behulp van persona's.</p>
      <p><span class="term">2. Klantstrategie bepalen met customer relevancy</span> — met het customer relevancy-model bepaalt u of u wilt excelleren in product, prijs, service, beleving of toegang, rekening houdend met de positionering van concurrenten.</p>
      <p><span class="term">3. Proposities verbeteren en innoveren</span> — het aanbod (producten, diensten en de manier van aanbieden) moet voortdurend verbeterd en vernieuwd worden, omdat klantwensen, concurrenten en marktstandaarden veranderen.</p>
      <p><span class="term">4. Klantbediening inrichten met customer journeys</span> — een <span class="term">customer journey</span> is een keten van klantervaringen uitgaande van één specifieke klantbehoefte (bijv. 'klant worden', 'service krijgen', 'online aankoop doen'), volledig door de ogen van de klant gezien. Het is géén proces.</p>
      <p><span class="term">5. Touchpoints vernieuwen — digitale klantervaringen</span> — <span class="term">touchpoints</span> zijn alle contactmomenten tussen organisatie en klant (medewerkers, winkels, YouTube, Facebook, klantenservice). Alle kanalen zijn relevant omdat klanten zelf bepalen hoe ze contact leggen.</p>
      <p>De bedrijfsstrategie is bewust als input opgenomen: nieuwe klantinzichten kunnen namelijk leiden tot een nieuwe of bijgestelde bedrijfsstrategie. In de praktijk zijn meerdere startmomenten mogelijk; organisaties moeten continu blijven vernieuwen.</p>

      <h4>Waarde voor klanten = waarde voor uw organisatie</h4>
      <p>Concrete <span class="term">klantdoelen</span> maken verbeteringen tastbaar en meetbaar. Via een <span class="term">outside-in benadering</span> sluiten verbeteringen beter aan op klanten, wat de kans op succes vergroot. Achterliggende doelstellingen van organisaties komen meestal terug op drie primaire commerciële doelen: (1) meer klanten aantrekken, (2) meer verkopen aan bestaande klanten, (3) klanten langer behouden.</p>
      <p>Een <span class="term">benefits logic</span>-schema maakt zichtbaar hoe klantinitiatieven en nieuwe proposities via oorzaak-gevolgrelaties bijdragen aan waarde voor de organisatie (bijvoorbeeld: minder fouten → minder klachten → grotere loyaliteit → lagere servicekosten). Bij non-profit- en overheidsorganisaties ligt de uiteindelijke waarde vaker bij continuïteit of een ideële doelstelling dan bij omzet.</p>

      <h4>Succes meten: klanttevredenheid en NPS</h4>
      <p>Klanttevredenheid op een schaal laten scoren geeft een gemiddeld beeld, maar is een <span class="term">te grove maat</span> — het maakt niet duidelijk waar klantervaringen goed zijn of beter moeten. Reichheld (loyalty-expert) laat zien dat ongeveer 80% van de vertrekkende klanten aangeeft 'tevreden' te zijn geweest: tevredenheid zegt dus niet veel over loyaliteit.</p>
      <p>De <span class="term">Net Promoter Score (NPS)</span> is een beter hulpmiddel (Reichheld, 2007). Eén vraag: 'Hoe waarschijnlijk is het dat u ons bedrijf aanbeveelt aan een vriend of collega?' Score 0–10. <span class="term">Promoters</span> (9-10) bevelen enthousiast aan, <span class="term">Passives</span> (7-8) zijn tevreden maar niet enthousiast, <span class="term">Detractors</span> (0-6) zijn ontevreden en houden groei tegen. NPS = % Promoters − % Detractors. Meet bij voorkeur op meerdere contactmomenten (bijv. vergelijken, kopen, service) in plaats van één totaalscore.</p>
      <p>Luister niet alleen naar klagende klanten, maar juist ook naar <span class="term">superpromotors</span>: enthousiastelingen die hun enthousiasme delen of uitdragen en anderen beïnvloeden (Vogelaar, 2009), expliciet of impliciet. Dit enthousiasme zorgt voor kopieergedrag, een goede reputatie en nieuwe klanten. Voorbeelden: Apple-klanten die in de rij staan, klanten die producten actief aanprijzen, of enthousiaste eigen medewerkers.</p>

      <h4>Customer experience roadmap</h4>
      <p>Een <span class="term">customer experience roadmap</span> zet alle initiatieven op een rij die worden uitgevoerd om klantwaarde te verbeteren en de gekozen positionering te versterken, ingedeeld naar inhoudelijke onderwerpen (proposities, kanalen, sales/accountmanagement, klantenservice, website, social media, processen). Tijdshorizon: enkele maanden tot een jaar.</p>
      <p>Aandachtspunten: (1) alleen extern gerichte initiatieven opnemen — de verandering moet zichtbaar zijn voor klanten; (2) formuleer projecten klantgericht, dus wat het de klant oplevert (bijv. niet 'verbeteren rapportage A' maar 'snelle en transparante informatie over A'); (3) effectief projectmanagement en voortgangsbewaking; (4) projectteams samenstellen met mensen van meerdere afdelingen, en de roadmap juist niet indelen naar afdelingen; (5) maak behaalde klantwaarde zichtbaar voor team en projecteigenaars.</p>

      <h4>Samenvatting en advies</h4>
      <p>Klantgerichtheid is een groeipad. De customer experience-aanpak zorgt ervoor dat klantinzicht, klantstrategie, innovaties, customer journeys en kanalen geïntegreerd worden ingezet: (1) gebruik de stappen om te zien waar verbeteringen nodig zijn; (2) onderbouw waarde met de benefits logic-aanpak; (3) neem alle verbeteringen op in één integrale customer experience roadmap.</p>
    `,

  {
    id: "h3",
    number: 3,
    title: "Klantinzicht – wat vinden uw klanten belangrijk?",
    summary: `
      <blockquote>"Because its purpose is to create a customer, the business has two — and only two — basic functions: marketing and innovation. Marketing and innovation produce results; all the rest are 'costs'." — Peter Drucker</blockquote>
      <p>Weten wie je klanten zijn en wat ze belangrijk vinden lijkt triviaal, maar veel organisaties hebben hier moeite mee. Klantinzicht is stap 1 van de customer experience-aanpak. Zonder dit inzicht is het lastig om zaken te doen en klanten uitstekende ervaringen te laten opdoen. Twee redenen waarom dit lastig is: (1) medewerkers besteden te weinig tijd aan contact met klanten en zijn vooral bezig met interne processen en procedures; (2) bedrijven onderschatten hoe lastig het is om klantbehoeften goed in beeld te krijgen.</p>

      <h4>Mythe: bedrijven weten wat hun klanten echt belangrijk vinden</h4>
      <p>Succesvolle bedrijven weten wél waarom klanten zaken met hen doen en klant blijven. Dat levert waarde op: (1) als je de redenen kent, kun je klanten en vergelijkbare klanten behouden (<span class="term">retentie</span>) door de klantbediening hierop af te stemmen, in plaats van geforceerde loyaliteitssystemen zoals 'punten sparen'; (2) als je huidige klanten beter kent, is het makkelijker nieuwe klanten met een vergelijkbaar profiel aan te trekken; (3) inzicht in klantwensen vergroot de kans op succesvolle <span class="term">cross selling</span> (andere producten voorstellen) en <span class="term">deep selling</span> (bestaande producten uitbreiden) — zonder dat inzicht wordt dit al snel als platte verkoopactie gezien, mét inzicht als waardevolle hulp en advies.</p>

      <h4>Van kennis over producten naar kennis over mensen</h4>
      <p>Ga na hoe u contact legt met klanten: is de klant bekend, en is de persoon erachter bekend? Het kennen van een bedrijf betekent niet automatisch het kennen van de personen die de aankoopbeslissing nemen. <span class="term">'Kennen'</span> gaat zowel over persoonlijk kennen als over het beschikken over de juiste gegevens en wensen/voorkeuren. Ondanks jarenlange investeringen in CRM wordt klantkennis vaak niet of slecht vastgelegd.</p>

      <h4>Mythe: organisaties kennen hun klanten</h4>
      <p>Het voorbeeld van de plaatselijke groenteman versus Albert Heijn laat zien dat beide op hun eigen schaal klantkennis opbouwen: de groenteman door klanten bij naam te kennen, de supermarkt via een bonuskaart en een transactiedatabase (bijvoorbeeld om kooppatronen te herkennen of gepersonaliseerde aanbiedingen te doen via de Appie-app). Opslaan van klantgegevens is echter niet hetzelfde als 'je klanten kennen': een klant kan anoniem blijven en toch heel loyaal zijn, en correct vastgelegde gegevens worden niet automatisch ook goed gebruikt door medewerkers.</p>
      <p>Veel bedrijven hebben hun business rondom adressen, klant- of banknummers gebouwd in plaats van rondom de personen die de aankoopbeslissing nemen (denk aan een garage die eerst naar het kenteken vraagt). Figuur 6 toont drie oplopende niveaus van klantkennis: <span class="term">(1) productgericht</span> (rekeningnummer, aansluiting, kenteken, adres — er is een productadministratie, geen klantbestand), <span class="term">(2) persoonsgericht</span> (verzekeringnemer, gezinshoofd, klant bij naam kennen), en <span class="term">(3) netwerk met personen</span> (gezin, bedrijf of vereniging met meerdere beslissers en contactpersonen — de meest complexe vorm). De stap van product/transactie naar het kennen van de persoon erachter is voor veel organisaties nog groot, en nog niet veel bedrijven kunnen goed omgaan met een heel netwerk van personen rond één klant.</p>

      <h4>Klantgroepen</h4>
      <p>Dé klant bestaat niet — toch gaan sterk productgerichte bedrijven er weleens van uit dat er één type klant is met dezelfde behoeften.</p>

      <h4>Mythe: we moeten dé klant in beeld brengen</h4>
      <p>De meeste bedrijven hebben een complexere markt die vraagt om denken in <span class="term">klantgroepen of segmenten</span>: groepen klanten die vergelijkbaar zijn in kenmerken, gedrag, profiel of klantwaarde, en die zich voldoende onderscheiden van andere groepen. Veelvoorkomende indelingen: particulier versus zakelijk, klantwaarde (topklanten versus minder omzet — 'slechte klanten' bestaan niet, want als je ze afstoot ontstaat automatisch een nieuwe groep 'slechte klanten'), grootte, leeftijdsgroepen, verkoopkanaal/kanaalvoorkeuren, lifestyle en gedrag (bijvoorbeeld <span class="term">innovators, early adopters en followers</span> bij technologie-adoptie), en klantgroepen die zichzelf vormen rond een thema of behoefte (bijvoorbeeld een online community).</p>
      <p>Houd de indeling eenvoudig: als een groep niet apart te benaderen, mailen of vinden is in de markt, heeft de indeling weinig toegevoegde waarde. Een goed voorbeeld van gericht inspelen op één klantgroep is Agis Zorgverzekeringen, dat via het jongerenmerk Take Care Now specifiek op jongeren inspeelt met gerichte communicatie, sociale media en acties. Dé klant bestaat niet, maar dat betekent niet dat alle klanten uniek zijn: er zijn altijd overeenkomsten te vinden in de klantbediening. Het belangrijkst is dat u klantgroepen zo kiest dat u ze kunt gebruiken om klantervaringen op aan te passen.</p>

      <h4>Persona's</h4>
      <p>Zodra klantgroepen zijn gekozen, kunnen deze vertaald worden naar <span class="term">persona's</span>: beeldende beschrijvingen van de kenmerken, behoeften en het gedrag van een klantgroep — in wezen fictieve klanten, getypeerd met kenmerken als leeftijd, geslacht, gedrag, beroep, vrijetijdsbesteding en voorkeuren, vaak met een naam en foto.</p>
      <p>Persona's dragen bij aan: aanpassing aan verschillende typen klanten (beter inspelen op customer journeys, proposities en kanalen), klantgerichtheid bij medewerkers (concreter beeld van klanten met een naam in plaats van abstracte klanten), communicatie over klanten (bijvoorbeeld 'maken we dit voor Jan of voor Astrid?') en betere verplaatsing in klantwensen.</p>
      <p>Voorbeeld in het boek: bij het ontwikkelen van een nieuwe onlinedienst voor woningreparaties zijn twee persona's gebruikt — <span class="term">Astrid</span> (36 jaar, drukke zelfstandig financieel adviseur, wil vooral flexibiliteit bij het inplannen en een korte wachttijd) en <span class="term">Jan</span> (70 jaar, gepensioneerd, wil vooral hulp bij het uitkiezen van een betrouwbare leverancier). Beide persona's vertegenwoordigen heel verschillende wensen en gedrag, wat ruimte geeft voor creativiteit bij het ontwerpen van de dienst.</p>

      <h4>Dag in het leven van...</h4>
      <p>Naast persona's kan het gedrag van een klantgroep verdiept worden met een <span class="term">'dag in het leven van...'</span>-beschrijving: een levendige beschrijving van wat een klant op een (of meerdere) dag(en) meemaakt, met nadruk op gedrag, kanaalgebruik en activiteiten. Dit is nodig omdat persona's alleen niet genoeg zijn om concrete vernieuwingen te bedenken. Het boek geeft als voorbeeld een dag uit het leven van persona Astrid, waarin ze onderweg via Twitter met haar energieleverancier in contact komt, tussen klantgesprekken door belt en 's avonds nog haar eigen bankzaken regelt.</p>

      <h4>Mythe: we moeten aan de klant gaan vragen wat hij wil</h4>
      <p>Er zijn <span class="term">expliciete klantbehoeften</span> (ook wel manifeste behoeften): deze kan de klant zelf goed verwoorden, bijvoorbeeld 'ik wil snel geholpen worden' of 'ik wil een lage prijs'. Daarnaast zijn er <span class="term">latente behoeften</span>: wel aanwezig, maar onbewust — klantbehoeften waarvan klanten nog niet weten dat ze hun gedrag gaan bepalen. Latente behoeften worden pas echt duidelijk als een klant praktijkervaring opdoet met een product of dienst. Bij de meeste innovaties van de afgelopen jaren konden klanten vooraf niet aangeven dat ze het nodig hadden, maar konden ze toch een succes worden door goed op deze latente behoeften in te spelen. Er is niet één manier om zowel expliciete als latente klantbehoeften in beeld te krijgen; het best werkt een combinatie van werkwijzen.</p>

      <h4>Voice of the customer: dertien manieren om klanten te leren kennen</h4>
      <p>Het boek noemt dertien technieken om de <span class="term">voice of the customer</span> in beeld te brengen en zo outside-in te leren denken in plaats van inside-out:</p>
      <p><span class="term">1. Klantfocussessies</span> (customer engagement) — intern, dwars door de organisatie, met vragen als 'welke relaties willen we met klanten hebben?'. Nadeel: klanten zelf zijn er niet bij betrokken.<br>
      <span class="term">2. Haal een klant naar binnen</span> bij workshops of overleg, en laat hem meepraten over verbeteringen.<br>
      <span class="term">3. Richt een klantenpanel in</span> — een grotere groep klanten die (eenmalig of vast) meedenkt, offline of online (zoals HEMA via Facebook, ING met stellingen op de website, of Dell's Idea Storm Platform waar klanten verbeteringen voorstellen en erop kunnen stemmen).<br>
      <span class="term">4. Diepte-interviews</span> met individuele klanten over situatie, achtergrond, motivatie en gedrag.<br>
      <span class="term">5. Ga naar klanten toe</span>, bijvoorbeeld in hun woon- of werkomgeving, om te zien hoe een product daadwerkelijk wordt gebruikt.<br>
      <span class="term">6. Word klant bij uw eigen bedrijf</span> (mystery shopper): zelf anoniem aankopen doen om het hele klantproces te doorlopen.<br>
      <span class="term">7. Luister mee in kanalen</span>, bijvoorbeeld bij de klantenservice of het callcenter.<br>
      <span class="term">8. Bekijk de klanten van de concurrent</span>: waarom kiezen zij daarvoor?<br>
      <span class="term">9. Creëer een prototype</span> en leg dit voor aan klanten, bijvoorbeeld via usability tests.<br>
      <span class="term">10. Doe praktijkervaring op in pilots</span>: een praktijktest in de eigen omgeving van de klant (in tegenstelling tot een prototype in een laboratoriumomgeving).<br>
      <span class="term">11. Customer intelligence</span>: het slim analyseren van de eigen klanten- en transactiedatabase. Dit geeft alleen inzicht in huidige klanten, niet in toekomstige gewenste klanten.<br>
      <span class="term">12. Marktonderzoek</span>, bijvoorbeeld onder een onafhankelijk consumentenpanel — waardevol, maar meer onderzoek leidt niet automatisch tot meer inzicht.</p>

      <h4>Mythe: met meer klantonderzoek weten we beter hoe we op klanten moeten inspelen</h4>
      <p><span class="term">13. Digital intelligence & social media-monitoring</span>: klanten volgen op sociale media met speciale software en gekozen zoektermen, wat kan uitgroeien tot een <span class="term">social listening center</span> dat digitaal klantbehoeften (en reacties op storingen of klachten) in beeld brengt.</p>

      <h4>Samenvatting en advies</h4>
      <p>Klanten zijn nog te vaak nummers in plaats van personen. Leer de personen kennen, hun klantbehoeften en wat zij écht belangrijk vinden, met behulp van meerdere outside-in-technieken: (1) gebruik meerdere technieken om de voice of the customer te achterhalen, (2) benut de inzichten om klantbehoeften op een rij te krijgen en te bepalen wat klanten het belangrijkst vinden, (3) creëer persona's die klanten en hun behoeften uitbeelden.</p>

    id: "h4",

    title: "Klantstrategie bepalen met customer relevancy",
    summary: `
      <blockquote>"Human values, not commercial value, have become the contemporary currency of commerce." — Crawford and Mathews</blockquote>
      <p>Het klantinzicht dat u hebt opgebouwd, kunt u gebruiken om een helder aanbod te bieden en een scherpe merkpositionering op te bouwen. Waarom kiezen klanten uw bedrijf? Het belangrijkst is of uw bedrijf een positie heeft ingenomen die <span class="term">herkenbaar, waardevol en onderscheidend</span> is ten opzichte van concurrenten. Daarvoor moet u goed inspelen op wat uw klanten belangrijk vinden én op datgene waar uw bedrijf goed in is.</p>

      <h4>Customer relevancy: vijf attributen</h4>
      <p><span class="term">Customer relevancy (CR)</span> is een strategisch hulpmiddel om die positionering te bepalen. CR gaat over vijf attributen: <span class="term">product, prijs, service, toegang en beleving</span> (Crawford & Mathews, 2003). Dit zijn de elementen waarmee klanten voor uw bedrijf kiezen en niet voor de concurrent. Ze kwamen naar voren uit onderzoek onder duizenden retailklanten in de Verenigde Staten naar de manier waarop zij hun retailer kozen; deze vijf aspecten speelden daarbij een cruciale rol, en voor Europa golden dezelfde conclusies. De attributen zijn bewezen toepasbaar in de consumentensector, de dienstensector, de zakelijke markt, bij online winkelen en bij digitaal (mobiel) koopgedrag. Het hulpmiddel heette oorspronkelijk <span class="term">consumer relevancy</span>, maar is door de inzet in de zakelijke markt aangepast naar customer relevancy.</p>
      <p>Customer relevancy geeft concrete invulling aan uw klantstrategie: het dwingt u om keuzes te maken over waar u écht goed in wilt zijn (alles tegelijk is geen goede keuze), het biedt houvast bij strategische workshops, interviews en het onderzoeken van klantervaringen, het draait om het maken van keuzes in positionering (beoordeeld door mensen, zowel als consument (B2C) als in een zakelijke rol (B2B)), en het helpt om na te denken over customer experience en digitale klantervaringen.</p>

      <h4>Focus voor uw klanten</h4>
      <p>De vijf attributen zijn een instrument om klantbehoeften (opgehaald met de technieken uit het vorige hoofdstuk) te vertalen naar keuzes waar u als bedrijf goed in wilt zijn. Door de voice of the customer te verwoorden met zinnen als <span class="term">'Ik wil...'</span> — alsof een klant het uitspreekt — wordt iedereen in het bedrijf gedwongen zich voortdurend in de klant te verplaatsen. Zo kan 'meer inzicht in tarieven' bijvoorbeeld 'ik wil inzicht in de opbouw van tarieven' betekenen, óf gewoon 'ik wil lage prijzen' — verschillende dingen die van heel verschillende klanten afkomstig kunnen zijn.</p>

      <h4>1. Product</h4>
      <p>Dit attribuut staat voor het product of de dienst waarvoor klanten naar uw bedrijf komen — fysiek (auto, koffie, tablet) of een dienst (spaarrekening, advies, verzekering) — plus kenmerken als kwaliteit, eigenschappen en mogelijkheden. Producten die uniek zijn in hun markt trekken daardoor klanten aan (bijvoorbeeld de Toyota Prius als eerste hybride auto, de iPhone als eerste smartphone, IKEA-meubels die niemand anders maakt) — vaak zijn dit trendsetters. Het beste product leveren betekent niet automatisch dat klanten daarvoor komen: veel consumenten vinden een consistente kwaliteit belangrijker dan de meest uitgebreide opties, en aspecten als uitbreidbaarheid, toekomstvastheid en betrouwbaarheid spelen ook een rol. Als producten sterk op elkaar gaan lijken of zelfs 'commodity' worden, neemt de invloed van dit attribuut af. Bij fysieke producten is doorgaans duidelijk wat 'product' is en wat 'service'; bij diensten bepaalt de klant zelf waar die grens ligt.</p>
      <p>Voorbeelden van klantbehoeften bij dit attribuut: een hoge productkwaliteit, de beste producten, uitgebreide productkenmerken, een mooi design, een uniek product, een product dat uit te breiden is, een 'toekomstvast' en betrouwbaar product, consistente kwaliteit, innovatieve producten, een lange levensduur, en een echte expert die de dienst uitvoert.</p>

      <h4>2. Prijs</h4>
      <p>Dit attribuut omvat alles wat met de prijs van geleverde producten en diensten te maken heeft: de hoogte, maar ook transparantie, betrouwbaarheid van prijs en tarieven, en het afrekenmodel. Klanten vinden de hoogte van de prijs en korting belangrijk, maar hechten ook aan consistentie (de prijs verandert niet zonder reden) en een logische, navolgbare opbouw. Sommige producten worden juist gekocht omdat de prijs hoog is (dure horloges, luxe auto's) — de prijs is dan een middel om je te onderscheiden. Een goed voorbeeld van veranderend klantgedrag en aanbod op dit vlak is de afrekening van mobiele abonnementen: van een vast bedrag, via sms-bundels en prepaid, tot datagebruik als centrale factor — klanten zoeken niet de goedkoopste aanbieder, maar een tarifering die bij hun eigen gebruik past.</p>
      <p>Voorbeelden van klantbehoeften bij dit attribuut: scherpe tarieven, inzicht in de opbouw van de prijs, transparante en eerlijke prijzen, de laagste prijs, consistente prijzen, een hoge rente of rendement, flexibele of modulaire prijzen, en de beste korting.</p>

      <h4>3. Service</h4>
      <p>Service gaat om alle dienstverlening en begeleiding die klanten kunnen krijgen als toevoeging op het basisproduct of de basisdienst, zoals informatie over nieuwe ontwikkelingen, snelle en vakkundige antwoorden, klachtenafhandeling en extra serviceverlening. In de dienstensector zit er een knip tussen de dienst zelf (bijvoorbeeld een verzekering) en de service die een klant daarbij krijgt (bijvoorbeeld uitleg over voorwaarden). Service gaat niet alleen om contact ná de koop, maar ook vooraf, zoals het aanpassen en op maat maken van producten.</p>
      <p>Voorbeelden van klantbehoeften bij dit attribuut: deskundige medewerkers en adviseurs, consistente dienstverlening op alle contactmomenten, advies op maat, selfservicemogelijkheden, snelle oplossing van klachten, en proactief meedenken met de situatie van de klant.</p>

      <h4>4. Toegang</h4>
      <p>Toegang of toegankelijkheid gaat over de manier waarop product, dienst en service kunnen worden verkregen: op welke plaats, op welke tijd en via welk kanaal of medium (winkels, kantoren, online, mobiel, sociale media). Door digitale mogelijkheden zijn er veel nieuwe kansen voor klantcontact ontstaan, maar klanten stellen ook hoge eisen aan online toegang, zoals gemakkelijk gevonden worden en heldere informatie over producten en voorwaarden.</p>
      <p>Voorbeelden van klantbehoeften bij dit attribuut: een winkel of kantoor in de buurt, gemakkelijk contact kunnen opnemen, alles online kunnen kopen, bereikbare adviseurs (ook buiten kantoortijden), een heldere website, en apps met directe toegang tot relevante informatie en transacties.</p>

      <h4>5. Beleving</h4>
      <p>Beleving omvat de relatie, betrokkenheid en binding van de klant met het bedrijf en de merknaam — de emotie van klanten: wat spreekt hen aan in het merk, de producten en de diensten, en wordt de klant als mens aangesproken? Het gaat om de beleving van de merknaam, de historie van het bedrijf, betrouwbaarheid en de lifestyle die het bedrijf uitstraalt. Dit raakt klanten dieper dan wat mogelijk is met reclame: reclamecampagnes spreken klanten qua beleving aan, maar raken hen niet noodzakelijk in hun overtuigingen en waarden. Denk aan de verschillen tussen merken in mode, sport en auto's (Adidas of Nike, Audi of Peugeot) — ook bij vergelijkbare producten speelt beleving een grote rol.</p>
      <p>Voorbeelden van klantbehoeften bij dit attribuut: een merknaam die ik vertrouw, als mens behandeld en persoonlijk herkend worden, vooroplopen met de nieuwste producten, deel uitmaken van een exclusieve groep klanten, een bedrijf dat bij mijn lifestyle past, en een merk dat 'hip' of juist degelijk is.</p>

      <h4>Het customer relevancy-model: niveaus</h4>
      <p>Met de vijf attributen vertaalt u outside-in gevonden klantbehoeften naar de aspecten die het meest doorslaggevend zijn in de keuze voor uw bedrijf. Het principe van customer relevancy is dat bedrijven met een duidelijk onderscheidend profiel het best presteren: een bedrijf kiest één aspect om op te <span class="term">domineren</span> (de beste), één om op te <span class="term">differentiëren</span> (actief gezocht door klanten), en de overige aspecten moeten <span class="term">marktconform ('op par')</span> zijn.</p>
      <p><span class="term">Dominerend (niveau 5):</span> het bedrijf is op dit aspect de allerbeste in de markt, met 'world class'-prestaties — geen concurrent kan het evenaren. <span class="term">Differentiërend (niveau 4):</span> het bedrijf is op dit aspect een van de voorkeursleveranciers; klanten waarderen dit, al is het ondersteunend aan het dominerende aspect. <span class="term">Op par (marktconform):</span> het bedrijf presteert hier gelijk aan de rest van de markt — dit niveau staat niet stil, maar schuift mee met steeds veeleisender klanten en vernieuwende concurrenten. <span class="term">Onder par:</span> concurrenten zijn hier duidelijk beter en klantervaringen zijn ondermaats, met het risico dat klanten vertrekken. Geen bedrijf kan het zich veroorloven om op een aspect onder par te scoren.</p>
      <p>Uit het onderzoek blijkt dat de best presterende bedrijven (ook financieel) het profiel <span class="term">5-4-3-3-3</span> hebben: dominerend op één attribuut, differentiërend op een tweede, en op par op de rest.</p>

      <h4>Mythe: op alle aspecten de beste zijn is dé manier om klanten te werven en te behouden</h4>
      <p>Het is een mythe dat een bedrijf dat overal de beste probeert te zijn, ook de beste prestaties levert (Crawford & Mathews, 2003). Voor klanten is het juist onduidelijk waarom ze uw bedrijf moeten kiezen als u overal het beste wilt zijn, en het is bovendien erg duur om in alle aspecten tegelijk te investeren. Onderzoek laat zien dat een scherp gekozen positionering tot betere resultaten leidt. De impact die u kunt hebben, verschilt wel per branche: <span class="term">Rossiter en Percy (1999)</span> laten zien dat klanten zich bij hun keuzes laten sturen door zowel de <span class="term">betrokkenheid</span> bij het product (laag, bijvoorbeeld een wasmiddel, of hoog, bijvoorbeeld een huurhuis) als de <span class="term">aankoopmotivatie</span> (negatief, zoals een geneesmiddel, of positief, zoals een vakantie). Dit bepaalt mede de speelruimte om met beleving en product te werken — bij een negatieve aankoopmotivatie zullen klanten bijvoorbeeld niet snel enthousiast worden van een 'hippe' reclamecampagne.</p>

      <h4>Onderscheidend vermogen</h4>
      <p>De sterkste bedrijven hebben een duidelijk herkenbare positionering: klanten hebben een scherp beeld van wat het bedrijf levert en hoe. Denk aan KLM (kwaliteit en service), Volvo (veiligheid) of Lidl (lage prijzen). Volgens <span class="term">Ries en Trout (1994)</span> zou elk bedrijf één woord moeten hebben waarmee klanten het herkennen. Onderscheid creëren is voor veel bedrijven moeilijk, door: het niet kiezen voor één aspect om te benadrukken (vooral bij grote aanbieders), veranderingen in de markten waarin het bedrijf actief is (bijvoorbeeld Philips, actief in meerdere sectoren), een wisselend beeld tussen wat medewerkers laten zien en wat de marketing promoot, en het willen zijn van 'de beste in alles', wat investeringen versnippert.</p>

      <h4>Customer relevancy volgens medewerkers en klanten</h4>
      <p>Een goede manier om te starten is door managers, klantcontactmedewerkers én klanten apart het customer relevancy-model voor het bedrijf te laten invullen: waar denken zij dat het bedrijf dominerend en differentiërend is? Komt dit overeen? Vaak blijken deze beelden niet goed op elkaar te passen, wat helpt om de urgentie zichtbaar te maken.</p>

      <h4>Cases: retailbanken en Avéro Achmea</h4>
      <p>Bij een onderzoek naar de <span class="term">positionering van retailbanken</span> in Nederland (met onderzoeksbureau GfK, vlak voor de financiële crisis) bleek dat de helft van de banken geen onderscheidend profiel had, zelfs niet bij hun eigen klanten — vooral bij de grote banken. Kleinere spelers zoals ASN Bank en Triodos Bank lieten wél een opvallender beeld achter, met betere scores op service en onderscheidende producten. Banken die onder par scoorden, liepen tijdens de kredietcrisis het meeste risico; kleinere banken met een scherper profiel deden het relatief goed.</p>
      <p><span class="term">Avéro Achmea</span>, een verzekeraar die verzekeringen verkoopt via onafhankelijke intermediairs, koos er met customer relevancy voor om te domineren op <span class="term">service</span> en te differentiëren op <span class="term">beleving</span>, terwijl toegang, product en prijs op par moesten komen en blijven. Dit werd concreet gemaakt met initiatieven zoals <span class="term">Voorzie</span> (een programma om intermediairs te helpen hun bedrijf te ontwikkelen) en <span class="term">De Waarde van Advies</span> (een initiatief over de toegevoegde waarde van advies). Al deze initiatieven werden opgenomen in een customer experience roadmap, met als criterium dat elk project meer toegevoegde waarde voor intermediairs moest opleveren.</p>

      <h4>Samenvatting en advies</h4>
      <p>De vijf attributen van customer relevancy — product, prijs, service, toegang en beleving — laten zien hoe klanten hun keuzes bepalen. In één attribuut moet u het beste zijn, het tweede is differentiërend, en de rest moet op par zijn. (1) Vertaal klantbehoeften met de vijf attributen naar de focus van uw bedrijf, met concrete subattributen. (2) Bepaal de dominerende en differentiërende attributen voor een herkenbare positionering.</p>

    title: "Klantbediening inrichten met customer journeys",
    summary: `
      <blockquote>Steve Jobs: eenvoud bereiken is vaak harder dan complexiteit, maar het harde werk om je denken helder te krijgen loont uiteindelijk enorm.</blockquote>
      <p>Om de klantbediening in te richten zoals bedoeld in de klantstrategie en de proposities, is de aanpak met <span class="term">customer journeys</span> de beste werkwijze. Bedrijfsprocessen zijn bedoeld voor het bedrijf; customer journeys beschrijven daarentegen de activiteiten die de klant doorloopt, gezien vanuit zijn perspectief — als een reeks contactmomenten met medewerkers, website, callcenter en winkel.</p>
      <p>Bij een customer journey gaat het erom de gekozen positionering en proposities in de praktijk waar te maken: worden klanten op doorslaggevende momenten (de <span class="term">moments of truth</span>) écht goed bediend zoals bedoeld?</p>

      <h4>Tekortkomingen in de praktijk</h4>
      <p>Werken met customer journeys is populair, maar in de praktijk zijn er vaak tekortkomingen: de scope wordt soms te groot gemaakt (alle activiteiten of zelfs de hele organisatie in één keten), de visuele schets wordt soms te veel benadrukt terwijl de achtereenvolgende contactmomenten onvoldoende worden uitgewerkt, en soms verwordt de journey toch weer tot een procesbeschrijving waarin de interne procedure prevaleert boven wat de klant wil. Verbeterde customer journeys leiden tot het waarmaken van klantverwachtingen en het overtreffen ervan op cruciale momenten — dat levert minder afhakende klanten en meer promotors op.</p>

      <h4>Customer life cycle</h4>
      <p>Customer experience betekent dat organisaties bewust sturen op alle ervaringen die klanten met de organisatie opdoen — die ervaringen zijn niet statisch, maar een opeenvolging van indrukken (commercials, verhalen van vrienden, een telefoontje, een servicebezoek, foto's op de website, de manier waarop je een factuur ontvangt).</p>
      <p>Een goed voorbeeld is het verschil tussen het proces zoals een bank het ziet bij een hypotheekaanvraag (identificeren klant → klantwensen inventariseren → adviesgesprek → offerte uitbrengen → offerte verwerken) en de klantketen zoals de klant die ervaart (huizen bekijken en vergelijken → inschatten wat je zou kunnen kopen → huis kopen met een makelaar → oriënteren op hypotheken → huis passeren en sleutel ophalen). De klant doorloopt heel andere stappen dan het bankproces suggereert, en de bank speelt daardoor niet automatisch goed in op de belevingswereld van de klant.</p>
      <p>Een <span class="term">customer life cycle</span> is een klantketen waarin alle fasen zijn opgenomen die een klant met de organisatie doorloopt, vanaf het leren kennen van de organisatie tot het verlengen of beëindigen van de relatie. Dit is de eerste stap om customer journeys in beeld te brengen, en anders dan de customer journeys zelf. Omschrijf de fasen vanuit het perspectief van de klant (bijvoorbeeld 'producten vergelijken', niet 'offerte opstellen'). Er is geen generieke life cycle voor alle bedrijven; de scope moet gaan om één gelijksoortige product-marktcombinatie — een bank met zowel een retail- als een zakelijke tak heeft dus niet één gezamenlijke life cycle, omdat de klanten en activiteiten te verschillend zijn.</p>
      <p>Bij het beschrijven van de customer life cycle verplaatsen medewerkers zich in klanten, wat een outside-in beeld van de klantbediening oplevert en helpt om verbeterpunten op te sporen (bijvoorbeeld onhandig verlopend online kopen, of wachttijden zonder contact). Zelfs bij het afscheid nemen van een klant kan de klantbediening geoptimaliseerd worden — het boek geeft als afschrikwekkend voorbeeld een kort Windows-dialoogvenster met de tekst 'De klantrelatie is beëindigd', dat feitelijk klopt maar allerminst uitnodigt om ooit nog terug te komen.</p>

      <h4>Customer journeys ontwerpen</h4>
      <p>De customer life cycle dient als 'kapstok' om concrete customer journeys te ontwerpen: verdeel de belangrijkste klantbehoeften (in 'ik wil...'-vorm, zie hoofdstuk 4) over de fasen van de keten. Bij een verzekeraar bijvoorbeeld lopen de fasen van 'bewust van risico's' via 'oriënteren', 'advies krijgen', 'afsluiten en betalen', 'advies over preventie', 'schade indienen' en 'service ontvangen' tot 'polis verlengen' — elk met eigen klantbehoeften ('ik wil weten welke risico's ik loop', 'ik wil geen papierwerk bij schade', enzovoort). Als een verzekeraar wil domineren op service en differentiëren op product, moet hij júist bij de fasen waar deze aspecten spelen (advies, schade, service) uitstekend presteren — daar komen de belangrijkste klantwensen en de gekozen positionering samen.</p>
      <p>Een <span class="term">customer journey</span> is een samenhangende set van activiteiten die u voor klanten op een betere of nieuwere manier wilt uitvoeren. Ze start met een klantwens of -behoefte en eindigt met een andere situatie bij de klant, waarin de behoefte is ingewilligd of het probleem is opgelost. Op basis van klantprioriteiten kunt u kiezen welke customer journeys eerst verbeterd worden.</p>

      <h4>Stappenplan customer journey-ontwikkeling</h4>
      <p>Eerst brengt u de huidige journey (de 'as is'-situatie) in beeld: (1) beschrijf de activiteiten die klanten nu met de organisatie meemaken, (2) identificeer de issues tijdens deze activiteiten, (3) breng het kanaalgebruik in beeld (zie hoofdstuk 7). Daarna ontwerpt u de gewenste journey (de 'to be'-situatie) vanuit het perspectief van de klant, in vijf stappen: (1) bedenk het start- en eindpunt, (2) bedenk en ontwerp de gewenste klantervaringen en geef de journey een typerende naam, (3) beschrijf de activiteiten in een voor de klant logische volgorde, actief en vanuit de klant geformuleerd (bijvoorbeeld 'advies krijgen over productvarianten', niet 'voorlichten over productvarianten'), (4) beschrijf via welke kanalen en touchpoints klanten de activiteiten kunnen uitvoeren, en (5) bedenk wat u wilt verbeteren en innoveren, met bewuste keuzes voor <span class="term">wowmomenten</span>.</p>

      <h4>Customer journeys verbeteren: acht manieren</h4>
      <p>Zoek verbeteringen niet in eenmalige cadeautjes, maar in structurele vernieuwingen van de journey. Het boek noemt acht manieren:</p>
      <p><span class="term">1. Ga na of alles waarde toevoegt voor klanten</span> — schrap activiteiten die alleen voor het bedrijf van waarde zijn, zoals onnodige formulieren of registratiestappen.<br>
      <span class="term">2. Consistente klantervaringen</span> — zorg dat activiteiten consistent zijn met andere journeys, met de positionering en met elkaar (IKEA wordt genoemd als voorbeeld van een bedrijf dat dit overal, van winkel tot webshop, consequent doet).<br>
      <span class="term">3. Creëer een onderscheidende benadering</span> — vul activiteiten in op een manier die zich onderscheidt van de concurrent, vooral op de aspecten waarmee u zich wilt onderscheiden.<br>
      <span class="term">4. Vereenvoudig en stroomlijn de journey</span> — de digitale belastingaangifte wordt genoemd als voorbeeld: eenvoud in het vinden van informatie en in de te doorlopen stappen bleek het belangrijkst voor klanten (Spenner & Freeman, 2012).<br>
      <span class="term">5. Verwijder barrières</span> — zoals de introductie van iDeal die het betalen bij online kopen sterk vereenvoudigde, of pick-up points voor het ophalen van bestellingen.<br>
      <span class="term">6. Verbeter de kwaliteit van content</span> — zorg voor consistente, hoogwaardige informatie in alle kanalen.<br>
      <span class="term">7. Lever relevante persoonlijke content</span> — personaliseer advies en online touchpoints op basis van de situatie van de klant.<br>
      <span class="term">8. Innoveer het contact tot een wowmoment</span> — KLM wordt genoemd als voorbeeld: klanten die op sociale media aangaven met KLM te vliegen, kregen bij de gate een op hen afgestemd persoonlijk cadeautje.</p>

      <h4>De invloed van medewerkers</h4>
      <p>Een customer journey wordt waargemaakt door processen, touchpoints, activiteiten én medewerkers. Klantcontacten lopen grotendeels via medewerkers, en hun reacties, uitstraling, gedrag en houding bepalen sterk wat klanten van een bedrijf vinden — vaak op meer momenten dan je zou denken (een telefoniste die onbewust doorverbindt naar de verkeerde afdeling, een accountmanager die niet op klantcontact maar op andere KPI's wordt afgerekend, een ingehuurd callcenter dat ook concurrenten promoot). Om medewerkers een nieuwe journey goed te laten uitvoeren, is er maar één manier: hen er vroeg bij betrekken, zodat het hún vernieuwing en hún manier van werken wordt. Belangrijke ontwerpprincipes: los vragen zo veel mogelijk in het eerste contact op (<span class="term">First Time Resolution</span>), geef medewerkers de middelen en ruimte om klanten direct te helpen, en besef dat plezier en gedrevenheid van medewerkers een groot effect hebben op klanten.</p>

      <h4>Case: Zappos</h4>
      <p><span class="term">Zappos</span>, een zeer succesvolle Amerikaanse online schoenenwinkel, koos vanaf de start voor de beste online experience: geen verzendkosten, een jaar lang gratis retourneren en hoogwaardige klantenservice — met als resultaat een fanbase van zo'n 12 miljoen klanten. CEO Tony Hsieh zorgde ervoor dat deze unieke klantervaring geleverd wordt door gemotiveerde en enthousiaste medewerkers: in het callcenter wordt niet beoordeeld op snelheid, maar op de manier waarop klanten worden geholpen, ook als dat uren duurt.</p>

      <h4>Samenvatting en advies</h4>
      <p>Een customer journey is een hulpmiddel om nieuwe of verbeterde klantbediening te ontwerpen, zodat u de klantervaringen waarmaakt die u hebt beloofd: (1) maak eerst een schets van de customer life cycle met de belangrijkste klantwensen, (2) analyseer zo nodig de huidige situatie en bepaal de bottlenecks, (3) ontwerp de gewenste klantervaringen met waardevolle, consistente activiteiten, wowmomenten en enthousiaste medewerkers, en (4) bedenk verbeteringen zoals het wegnemen van barrières of een nieuwe manier van contact leggen.</p>

/* ---------------- STATE ---------------- */
let state = {
  view: "dashboard",        // dashboard | chapter | tentamen | progress
  chapterId: null,
  chapterSub: "samenvatting",
  quizSession: null,
  history: []
};

/* ---------------- STORAGE ---------------- */
async function loadHistory(){
  try{
    const r = await window.storage.get('quiz-history', false);
    state.history = r ? JSON.parse(r.value) : [];
  }catch(e){ state.history = []; }
}
async function saveHistory(){
  try{ await window.storage.set('quiz-history', JSON.stringify(state.history), false); }
  catch(e){ console.error('opslaan mislukt', e); }
}

/* ---------------- QUIZ ENGINE ---------------- */
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function buildQuizQuestions(chapterIds, topicsFilter){
  let pool = [];
  chapterIds.forEach(cid=>{
    const ch = chapters.find(c=>c.id===cid);
    ch.quiz.forEach((q,idx)=>{
      if(topicsFilter && !topicsFilter.has(q.topic)) return;
      pool.push({...q, chapterId:cid, chapterTitle:"Hoofdstuk "+ch.number, qid:cid+"-"+idx});
    });
  });
  return pool;
}

function startQuiz(mode, chapterIds, topicsFilter){
  let questions = buildQuizQuestions(chapterIds, topicsFilter);
  if(mode==="tentamen"){
    questions = shuffle(questions);
  }
  // randomize options per question, keep track of correct index
  questions = questions.map(q=>{
    const order = shuffle(q.opts.map((_,i)=>i));
    const opts = order.map(i=>q.opts[i]);
    const correct = order.indexOf(q.correct);
    return {...q, opts, correct};
  });
  state.quizSession = {
    mode, chapterIds, questions,
    current:0,
    answers: new Array(questions.length).fill(null), // null = unanswered
    finished:false
  };
  state.view = mode==="tentamen" ? "tentamen" : "chapter";
  if(mode!=="tentamen"){ state.chapterSub = "oefentoets"; }
  render();
}

function selectAnswer(i){
  const s = state.quizSession;
  s.answers[s.current] = i;
  render();
}
function goTo(idx){
  const s = state.quizSession;
  s.current = Math.max(0, Math.min(s.questions.length-1, idx));
  render();
}
async function finishQuiz(){
  const s = state.quizSession;
  s.finished = true;
  const attempt = {
    date: new Date().toISOString(),
    mode: s.mode,
    chapterIds: s.chapterIds,
    total: s.questions.length,
    details: s.questions.map((q,i)=>({
      topic:q.topic, chapterTitle:q.chapterTitle,
      correct: s.answers[i]===q.correct,
      skipped: s.answers[i]===null
    }))
  };
  state.history.push(attempt);
  await saveHistory();
  render();
}

/* ---------------- ANALYTICS ---------------- */
function computeTopicStats(){
  const stats = {};
  state.history.forEach(att=>{
    att.details.forEach(d=>{
      if(!stats[d.topic]) stats[d.topic]={correct:0,total:0};
      stats[d.topic].total++;
      if(d.correct) stats[d.topic].correct++;
    });
  });
  return stats;
}
function computeChapterStats(){
  const stats = {};
  state.history.forEach(att=>{
    att.details.forEach(d=>{
      if(!stats[d.chapterTitle]) stats[d.chapterTitle]={correct:0,total:0};
      stats[d.chapterTitle].total++;
      if(d.correct) stats[d.chapterTitle].correct++;
    });
  });
  return stats;
}

/* ---------------- RENDER: NAV ---------------- */
function renderNav(){
  const nav = document.getElementById('nav');
  let html = `<div class="nav-item ${state.view==='dashboard'?'active':''}" onclick="goDashboard()">🏠 Dashboard</div>`;
  chapters.forEach(ch=>{
    const isOpen = state.view==='chapter' && state.chapterId===ch.id;
    html += `<div class="nav-item ${isOpen?'active':''}" onclick="openChapter('${ch.id}','samenvatting')">📖 Hoofdstuk ${ch.number}</div>`;
    if(isOpen){
      html += `<div class="nav-sub">
        <div class="nav-item ${state.chapterSub==='samenvatting'?'active':''}" onclick="openChapter('${ch.id}','samenvatting')">Samenvatting</div>
        <div class="nav-item ${state.chapterSub==='infographic'?'active':''}" onclick="openChapter('${ch.id}','infographic')">Infographic</div>
        <div class="nav-item ${state.chapterSub==='oefentoets'?'active':''}" onclick="openChapter('${ch.id}','oefentoets')">Oefentoets</div>
      </div>`;
    }
  });
  html += `<div class="nav-item ${state.view==='tentamen'?'active':''}" onclick="goTentamenSetup()">📝 Tentamen</div>`;
  html += `<div class="nav-item ${state.view==='progress'?'active':''}" onclick="goProgress()">🌸 Mijn voortgang</div>`;
  nav.innerHTML = html;
}

function goDashboard(){ state.view="dashboard"; render(); }
function openChapter(id, sub){ state.view="chapter"; state.chapterId=id; state.chapterSub=sub; state.quizSession=null; render(); }
function goTentamenSetup(){ state.view="tentamen"; state.quizSession=null; render(); }
function goProgress(){ state.view="progress"; render(); }

/* ---------------- RENDER: MAIN ---------------- */
function render(){
  renderNav();
  const main = document.getElementById('main');
  if(state.view==='dashboard') main.innerHTML = renderDashboard();
  else if(state.view==='chapter') main.innerHTML = renderChapter();
  else if(state.view==='tentamen') main.innerHTML = renderTentamen();
  else if(state.view==='progress') main.innerHTML = renderProgress();
}

function renderDashboard(){
  const totalAttempts = state.history.length;
  const totalQ = state.history.reduce((a,h)=>a+h.total,0);
  const totalCorrect = state.history.reduce((a,h)=>a+h.details.filter(d=>d.correct).length,0);
  const avg = totalQ ? Math.round(100*totalCorrect/totalQ) : null;
  let tiles = chapters.map(ch=>`
    <div class="chapter-tile" onclick="openChapter('${ch.id}','samenvatting')">
      <div><strong>Hoofdstuk ${ch.number}</strong><br><span style="font-size:0.85em; color:var(--ink-soft)">${ch.title}</span></div>
      <div>→</div>
    </div>`).join('');
  return `
    <h1>Welkom terug ✿</h1>
    <p class="empty-note" style="margin-bottom:20px;">Een rustige plek om hoofdstuk voor hoofdstuk te leren voor je tentamen.</p>
    <div class="grid" style="margin-bottom:24px;">
      <div class="card stat"><div class="num">${chapters.length}</div><div class="label">hoofdstukken toegevoegd</div></div>
      <div class="card stat"><div class="num">${avg===null?'—':avg+'%'}</div><div class="label">gemiddelde score tot nu toe</div></div>
    </div>
    <div class="card">
      <h3>Hoofdstukken</h3>
      ${tiles}
    </div>
  `;
}

function renderChapter(){
  const ch = chapters.find(c=>c.id===state.chapterId);
  if(state.chapterSub==='samenvatting'){
    return `<div class="card summary"><h2>Hoofdstuk ${ch.number} — Samenvatting</h2>${ch.summary}</div>`;
  }
  if(state.chapterSub==='infographic'){
    return `<div class="card"><h2>Hoofdstuk ${ch.number} — Infographic</h2>${ch.infographicHtml}</div>`;
  }
  if(state.chapterSub==='oefentoets'){
    if(!state.quizSession || state.quizSession.mode!=='chapter' || state.quizSession.chapterIds[0]!==ch.id){
      return `<div class="card">
        <h2>Oefentoets — Hoofdstuk ${ch.number}</h2>
        <p>${ch.quiz.length} meerkeuzevragen over dit hoofdstuk, met een mix van onthouden, begrijpen en toepassen.</p>
        <button onclick="startQuiz('chapter', ['${ch.id}'])">Start oefentoets</button>
      </div>`;
    }
    return renderQuizRunner();
  }
}

function escapeJs(str){ return String(str).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function initTentamenTopics(){
  if(!state.tentamenTopics){
    state.tentamenTopics = new Set();
    chapters.forEach(ch=> ch.quiz.forEach(q=> state.tentamenTopics.add(q.topic)));
  }
}
function toggleTentamenTopic(topic){
  initTentamenTopics();
  if(state.tentamenTopics.has(topic)) state.tentamenTopics.delete(topic);
  else state.tentamenTopics.add(topic);
  render();
}
function toggleTentamenChapterAll(chapterId, select){
  initTentamenTopics();
  const ch = chapters.find(c=>c.id===chapterId);
  const topics = [...new Set(ch.quiz.map(q=>q.topic))];
  topics.forEach(t=> select ? state.tentamenTopics.add(t) : state.tentamenTopics.delete(t));
  render();
}
function selectAllTentamenTopics(select){
  state.tentamenTopics = new Set();
  if(select){ chapters.forEach(ch=> ch.quiz.forEach(q=> state.tentamenTopics.add(q.topic))); }
  render();
}
function countQuestionsForTopics(topicsSet){
  let count=0;
  chapters.forEach(ch=> ch.quiz.forEach(q=>{ if(topicsSet.has(q.topic)) count++; }));
  return count;
}
function startTentamenWithTopics(){
  initTentamenTopics();
  const chapterIds = chapters.map(c=>c.id);
  startQuiz('tentamen', chapterIds, state.tentamenTopics);
}

function renderTentamen(){
  if(!state.quizSession){
    initTentamenTopics();
    const chapterBlocks = chapters.map(ch=>{
      const topics = [...new Set(ch.quiz.map(q=>q.topic))];
      const topicRows = topics.map(t=>{
        const checked = state.tentamenTopics.has(t);
        return `<label style="display:flex; align-items:center; gap:8px; padding:5px 0; font-size:0.88em; cursor:pointer;">
          <input type="checkbox" ${checked?'checked':''} onchange="toggleTentamenTopic('${escapeJs(t)}')"> ${t}
        </label>`;
      }).join('');
      return `<div style="margin-bottom:16px;">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1.5px dashed var(--lilac-deep); padding-bottom:4px; margin-bottom:4px;">
          <strong style="color:var(--rose-dark);">Hoofdstuk ${ch.number}</strong>
          <span style="font-size:0.78em;">
            <a href="#" onclick="toggleTentamenChapterAll('${ch.id}',true);return false;" style="color:var(--rose-dark); text-decoration:underline;">alles</a> ·
            <a href="#" onclick="toggleTentamenChapterAll('${ch.id}',false);return false;" style="color:var(--rose-dark); text-decoration:underline;">geen</a>
          </span>
        </div>
        ${topicRows}
      </div>`;
    }).join('');
    const totalSelected = countQuestionsForTopics(state.tentamenTopics);
    return `<div class="card">
      <h2>Tentamenmodus</h2>
      <p>Vink de onderwerpen aan waarover je vragen wilt oefenen — laat alles aangevinkt voor een volledig tentamen. Vragen en antwoordvolgorde worden gerandomiseerd.</p>
      <div style="margin-bottom:14px;">
        <button class="secondary" onclick="selectAllTentamenTopics(true)">Alles selecteren</button>
        <button class="secondary" onclick="selectAllTentamenTopics(false)">Alles deselecteren</button>
      </div>
      ${chapterBlocks}
      <button onclick="startTentamenWithTopics()" ${totalSelected===0?'disabled':''}>Start tentamen (${totalSelected} vragen)</button>
      ${totalSelected===0 ? '<p class="empty-note" style="margin-top:10px;">Selecteer minimaal één onderwerp.</p>' : ''}
    </div>`;
  }
  return renderQuizRunner();
}

function renderQuizRunner(){
  const s = state.quizSession;
  if(s.finished) return renderResults();
  const q = s.questions[s.current];
  const answered = s.answers[s.current];
  const pct = Math.round(((s.current+1)/s.questions.length)*100);
  let optsHtml = q.opts.map((opt,i)=>{
    let cls = 'option';
    if(answered===i) cls += ' selected';
    return `<div class="${cls}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${opt}</div>`;
  }).join('');
  let qmap = s.questions.map((_,i)=>{
    let cls = i===s.current?'current':'';
    if(s.answers[i]!==null) cls += ' answered';
    return `<span class="${cls}" onclick="goTo(${i})">${i+1}</span>`;
  }).join('');
  const allAnswered = s.answers.every(a=>a!==null);
  return `
    <div class="card">
      <div class="progressbar"><div style="width:${pct}%"></div></div>
      <div class="qcounter">Vraag ${s.current+1} van ${s.questions.length} ${s.mode==='tentamen'?'· '+q.chapterTitle:''}</div>
      <h3>${q.q}</h3>
      ${optsHtml}
      <div class="qmap">${qmap}</div>
      <div class="qnav">
        <button class="secondary" onclick="goTo(${s.current-1})" ${s.current===0?'disabled':''}>← Terug</button>
        ${s.current < s.questions.length-1
          ? `<button onclick="goTo(${s.current+1})">Volgende →</button>`
          : `<button onclick="finishQuiz()" ${!allAnswered?'':''}>Toets inleveren</button>`}
      </div>
      ${!allAnswered && s.current===s.questions.length-1 ? '<p class="empty-note" style="margin-top:10px;">Je kunt ook onbeantwoorde vragen inleveren — die tellen als overgeslagen.</p>' : ''}
    </div>
  `;
}

function renderResults(){
  const s = state.quizSession;
  const total = s.questions.length;
  let correct=0, wrong=0, skipped=0;
  const perChapter = {};
  const perTopic = {};
  s.questions.forEach((q,i)=>{
    const a = s.answers[i];
    const isCorrect = a===q.correct;
    if(a===null) skipped++;
    else if(isCorrect) correct++;
    else wrong++;
    if(!perChapter[q.chapterTitle]) perChapter[q.chapterTitle]={c:0,t:0};
    perChapter[q.chapterTitle].t++;
    if(isCorrect) perChapter[q.chapterTitle].c++;
    if(!perTopic[q.topic]) perTopic[q.topic]={c:0,t:0};
    perTopic[q.topic].t++;
    if(isCorrect) perTopic[q.topic].c++;
  });
  const pct = Math.round(100*correct/total);

  let chapterHtml = Object.entries(perChapter).map(([name,v])=>{
    const p = Math.round(100*v.c/v.t);
    return `<div class="topic-bar-row"><div class="name">${name}</div><div class="topic-bar-track"><div class="topic-bar-fill" style="width:${p}%; background:${p>=70?'var(--green-ok)':p>=40?'var(--gold)':'var(--red-no)'}"></div></div><div>${p}%</div></div>`;
  }).join('');

  let weakTopics = Object.entries(perTopic).filter(([_,v])=>v.c/v.t < 0.6);
  let topicFeedback = weakTopics.length ? weakTopics.map(([name,v])=>{
    const p = Math.round(100*v.c/v.t);
    return `<p>Je maakt relatief veel fouten bij <span class="term">${name}</span> (${p}% goed). Bekijk dit onderwerp opnieuw in de samenvatting of infographic.</p>`;
  }).join('') : `<p class="empty-note">Geen duidelijke zwakke onderwerpen bij deze toets — goed gedaan!</p>`;

  let reviewHtml = s.questions.map((q,i)=>{
    const a = s.answers[i];
    if(a===q.correct) return '';
    const cls = a===null?'skipped':'wrong';
    return `<div class="review-item ${cls}">
      <strong>${q.q}</strong><br>
      <span style="font-size:0.88em;">Jouw antwoord: ${a===null?'<em>overgeslagen</em>':q.opts[a]}</span><br>
      <span style="font-size:0.88em; color:var(--green-ok);">Juiste antwoord: ${q.opts[q.correct]}</span><br>
      <span style="font-size:0.8em; color:var(--ink-soft);">${q.chapterTitle} · ${q.topic}</span>
    </div>`;
  }).join('');

  return `
    <div class="card result-score">
      <div class="big">${pct}%</div>
      <p><span class="pill rose">${correct} goed</span><span class="pill" style="background:#F1D6D6;color:#8A3A3A;">${wrong} fout</span><span class="pill gold">${skipped} overgeslagen</span></p>
    </div>
    <div class="card">
      <h3>Analyse per hoofdstuk</h3>
      ${chapterHtml}
    </div>
    <div class="card">
      <h3>Feedback per onderwerp</h3>
      ${topicFeedback}
    </div>
    ${reviewHtml ? `<div class="card"><h3>Nabespreking van foute/overgeslagen vragen</h3>${reviewHtml}</div>` : ''}
    <button onclick="restartFromResults()">Terug naar overzicht</button>
  `;
}

function restartFromResults(){
  const mode = state.quizSession.mode;
  state.quizSession = null;
  state.view = mode==='tentamen' ? 'tentamen' : 'chapter';
  render();
}

function renderProgress(){
  const topicStats = computeTopicStats();
  const chapterStats = computeChapterStats();
  if(state.history.length===0){
    return `<div class="card"><h2>Mijn voortgang 🌸</h2><p class="empty-note">Nog geen toetsen gemaakt. Doe een oefentoets of tentamen om je voortgang hier te zien.</p></div>`;
  }
  const entries = Object.entries(topicStats).map(([name,v])=>({name, pct: v.c/v.t, ...v}));
  const strong = entries.filter(e=>e.pct>=0.75).sort((a,b)=>b.pct-a.pct);
  const practice = entries.filter(e=>e.pct>=0.4 && e.pct<0.75).sort((a,b)=>a.pct-b.pct);
  const priority = entries.filter(e=>e.pct<0.4).sort((a,b)=>a.pct-b.pct);

  function list(arr, empty){
    if(!arr.length) return `<p class="empty-note">${empty}</p>`;
    return arr.map(e=>`<div class="topic-bar-row"><div class="name">${e.name}</div><div class="topic-bar-track"><div class="topic-bar-fill" style="width:${Math.round(e.pct*100)}%; background:${e.pct>=0.75?'var(--green-ok)':e.pct>=0.4?'var(--gold)':'var(--red-no)'}"></div></div><div>${Math.round(e.pct*100)}%</div></div>`).join('');
  }

  let chapterHistoryRows = Object.entries(chapterStats).map(([name,v])=>{
    const p = Math.round(100*v.c/v.t);
    return `<div class="topic-bar-row"><div class="name">${name}</div><div class="topic-bar-track"><div class="topic-bar-fill" style="width:${p}%; background:${p>=70?'var(--green-ok)':p>=40?'var(--gold)':'var(--red-no)'}"></div></div><div>${p}%</div></div>`;
  }).join('');

  let scoreHistory = state.history.slice().reverse().slice(0,10).map(h=>{
    const c = h.details.filter(d=>d.correct).length;
    const pct = Math.round(100*c/h.total);
    const d = new Date(h.date);
    return `<div class="topic-bar-row"><div class="name">${d.toLocaleDateString('nl-NL')} · ${h.mode==='tentamen'?'Tentamen':'Oefentoets'}</div><div class="topic-bar-track"><div class="topic-bar-fill" style="width:${pct}%; background:var(--lilac-deep)"></div></div><div>${pct}%</div></div>`;
  }).join('');

  return `
    <div class="card"><h2>Mijn voortgang 🌸</h2>
      <p class="empty-note">${state.history.length} toets(en) gemaakt in totaal.</p>
    </div>
    <div class="card"><h3>Score per hoofdstuk</h3>${chapterHistoryRows}</div>
    <div class="card"><h3>Recente toetsscores</h3>${scoreHistory}</div>
    <div class="card"><h3>✿ Sterk</h3>${list(strong,'Nog geen onderwerpen die duidelijk sterk zijn.')}</div>
    <div class="card"><h3>📖 Nog oefenen</h3>${list(practice,'Geen onderwerpen die extra oefening nodig hebben.')}</div>
    <div class="card"><h3>⚠️ Prioriteit</h3>${list(priority,'Geen onderwerpen met prioriteit — goed bezig!')}</div>
  `;
}

/* ---------------- INIT ---------------- */
(async function init(){
  await loadHistory();
  render();
})();
</script>
</body>
</html>
